project:
  type: website
  output-dir: _site
  resources:
    - js/

website:
  title: "Breeding Concepts"
  description: "Interactive explanations of quantitative genetics and cultivar development."
  repo-url: https://github.com/jhgille2/breeding-concepts
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: roadmap.qmd
        text: Roadmap
    right:
      - icon: github
        href: https://github.com/jhgille2/breeding-concepts
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - section: "Populations and gene frequency"
        contents:
          - quantgen/hardy-weinberg.qmd
          - quantgen/selection-single-locus.qmd
      - section: "Drift and inbreeding"
        contents:
          - quantgen/genetic-drift.qmd
          - cultivar/selfing-homozygosity.qmd
      - section: "Genetic values and variance"
        contents:
          - quantgen/continuous-variation.qmd
          - quantgen/genotypic-values.qmd
          - quantgen/variance-components.qmd
      - section: "Heritability"
        contents:
          - cultivar/heritability-entry-mean.qmd
      - section: "Selection"
        contents:
          - quantgen/heritability-selection.qmd
          - quantgen/selection-intensity.qmd
          - cultivar/expected-gain.qmd
      - section: "Inbreeding and crossbreeding"
        contents:
          - quantgen/inbreeding-depression.qmd
      - section: "Self-pollinated crop methods"
        contents:
          - cultivar/ssd-bulk-pedigree.qmd
          - cultivar/backcrossing.qmd
      - section: "Population improvement"
        contents:
          - cultivar/recurrent-selection.qmd
      - section: "Field testing"
        contents:
          - cultivar/resource-allocation.qmd
      - section: "Across both books"
        contents:
          - general/gain-per-year.qmd
          - general/glossary.qmd
      - roadmap.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-fold: true
    code-summary: "Show widget code"
    html-math-method: katex
    css: styles.css

execute:
  echo: false
